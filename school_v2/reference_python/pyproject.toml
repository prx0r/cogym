[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogym"
version = "0.1.0"
description = "Deterministic evolutionary backtesting laboratory for LLM cognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cogym = "cogym.cli:main"

[tool.setuptools.packages.find]
include = ["cogym*"]
