[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogym"
version = "2.0.0"
description = """
Deterministic experimental optimization laboratory
for reasoning, routing and decision policies.
Worlds plug in: trading, fact verification, routing. Quality gates dominate;
cost and latency are optimized only after the quality floor holds.
"""
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cogym = "cogym.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cogym*"]
